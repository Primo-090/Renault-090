<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🚒 Renault 090🫡</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icono.PNG">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="loginScreen" class="login-screen">
  <div class="login-overlay">

    <div class="login-card">

      <img src="login.png" class="login-logo">

      <select id="loginUser" class="login-input">
        <option value="">Selecciona usuario</option>
        <option>Primo</option>
        <option>Pares</option>
        <option>Casañ</option>
        <option>Bodi</option>
        <option>Jefa</option>
      </select>

      <input
        id="loginPass"
        class="login-input"
        type="password"
        placeholder="Contraseña"
      >

      <button class="login-btn" onclick="login()">
        INICIAR SESIÓN
      </button>

    </div>

  </div>
</section>
  <header>
    <h1>🚒 Renault 090🫡</h1>
    <p>Inventario por apartados: LCIF, Inundaciones, Cabina y Taquilla de parque</p>
  </header>

<main id="appMain" style="display:none;">
    <section class="tabs">
      <button class="tab active" data-section="LCIF">LCIF</button>
      <button class="tab" data-section="Inundaciones">Inundaciones</button>
      <button class="tab" data-section="Material cabina">Material cabina</button>
      <button class="tab" data-section="Taquilla de parque">Taquilla parque</button>
      <button onclick="mostrarRelevo()">📋 Hoja de relevo</button>
    </section>

    <section class="toolbar">
      <input id="search" placeholder="Buscar material..." />
      <button id="exportCsv">Exportar CSV</button>
      <button id="resetData">Restaurar</button>
    </section>
<section id="relevo" style="display:none;">
  <h2>📋 Hoja de relevo</h2>

  <label>Entrega:</label>
  <input type="text" id="entrega" placeholder="Bombero que entrega">

  <label>Recibe:</label>
  <input type="text" id="recibe" placeholder="Bombero que recibe">

  <label>Material/incidencias relevantes:</label>
  <textarea id="obs" placeholder="Ej: Falta manguera 45 abajo..."></textarea>

  <button onclick="guardarRelevo()">Guardar relevo</button>
  <button onclick="exportarRelevosCSV()">Exportar CSV</button>
</section>
    <section class="form-card">
      <h2>Añadir material</h2>
      <div class="form-grid">
        <input id="name" placeholder="Nombre del material" />
        <input id="location" placeholder="Ubicación: arriba, abajo, cabina..." />
        <input id="requiredQty" type="number" min="0" placeholder="Cantidad obligatoria" />
        <input id="currentQty" type="number" min="0" placeholder="Cantidad actual" />
        <select id="status">
          <option>Operativo</option>
          <option>Falta</option>
          <option>Dañado</option>
          <option>Pendiente revisión</option>
          <option>Caducado</option>
        </select>
        <input id="notes" placeholder="Observaciones" />
      </div>
      <button id="addItem">Añadir al apartado actual</button>
    </section>

    <section class="summary" id="summary"></section>
    <section id="items" class="items"></section>
  </main>
